<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Courier | Make Your Payment</title>
    
    <!-- Google Fonts (Inter for a clean, modern look similar to the screenshot) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO SECTION -->
    <section class="hero-section">
        
        <!-- Header / Navigation -->
        <header class="hero-header">
            <button class="menu-btn" aria-label="Open Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            
            <div class="logo-area">
                <img src="https://raw.githubusercontent.com/Emyres970/Ultmteco/refs/heads/main/Src/UC1-1.png" alt="Ultimate Courier Logo" class="logo-img">
            </div>
        </header>

        <!-- Main Hero Content -->
        <div class="hero-content">
            <p class="hero-subtitle">This is the right place</p>
            <h1 class="hero-title">
                COURIER COST<br>
                CALCULATOR
            </h1>
            
            <!-- The small blue line under the title -->
            <div class="title-accent-line"></div>

            <!-- Action Buttons -->
            <div class="hero-buttons">
                <a href="#contact" class="btn btn-blue">
                    <i class="fa-regular fa-comment-dots"></i> CONTACT US
                </a>
                <a href="#services" class="btn btn-grey">
                    <i class="fa-solid fa-truck"></i> OUR SERVICES
                </a>
            </div>
        </div>

        <!-- Floating Chat Icon (Bottom Right) -->
        <button class="floating-chat-btn" aria-label="Chat with us">
            <i class="fa-solid fa-comment"></i>
        </button>

    </section>

    <!-- SECTION 1: OPTIONS -->
    <section class="form-section">
        
        <!-- Main Section Header Placeholder -->
        <h2 class="section-title">Section 1</h2>

        <!-- ========================================== -->
        <!-- OPTION 1 -->
        <!-- ========================================== -->
        <div class="option-container">
            
            <div class="option-header">
                <h3 class="option-title">Option 1: Enter option here</h3>
                <span class="image-marker">(Requires Image Upload)</span>
            </div>

            <!-- The Form Box -->
            <div class="form-box">
                
                <!-- Form Group: Label -->
                <div class="form-group">
                    <label for="form-label-1" class="form-label">Label Placeholder</label>
                    
                    <!-- Instruction Text -->
                    <p class="instruction-text">
                        <span class="instruction-bold">Instruction:</span> 
                        Placeholder for instructions.
                    </p>
                </div>

                <!-- Form Group: Image Upload -->
                <div class="form-group upload-group">
                    <label for="image-upload-1" class="upload-label">
                        Upload Image Label Placeholder
                    </label>
                    
                    <!-- Styled file input -->
                    <input type="file" id="image-upload-1" class="file-input" accept="image/*">
                </div>

                <!-- Submit Button -->
                <button type="button" class="submit-btn">
                    Upload Button Text Placeholder
                </button>

            </div>
        </div>

        <!-- ========================================== -->
        <!-- OPTION 2 -->
        <!-- ========================================== -->
        <div class="option-container">
            
            <div class="option-header">
                <h3 class="option-title">Option 2: Enter option here</h3>
                <span class="image-marker no-image">(No image needed)</span>
            </div>

            <!-- The Form Box -->
            <div class="form-box">
                
                <!-- Form Group: Label -->
                <div class="form-group">
                    <label for="form-label-2" class="form-label">Label Placeholder</label>
                    
                    <!-- Instruction Text -->
                    <p class="instruction-text">
                        <span class="instruction-bold">Instruction:</span> 
                        Placeholder for instructions.
                    </p>
                </div>

                <!-- Form Group: Image Upload (Keeping it here as requested, though text says no image needed) -->
                <div class="form-group upload-group">
                    <label for="image-upload-2" class="upload-label">
                        Upload Image Label Placeholder
                    </label>
                    
                    <!-- Styled file input -->
                    <input type="file" id="image-upload-2" class="file-input" accept="image/*">
                </div>

                <!-- Submit Button -->
                <button type="button" class="submit-btn">
                    Upload Button Text Placeholder
                </button>

            </div>
        </div>

    </section>

    <!-- Your JS -->
    <script src="main.js"></script>
</body>
</html>
