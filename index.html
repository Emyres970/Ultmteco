<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Courier | Make Your Payment</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO SECTION -->
    <section class="hero-section">
        
        <!-- Header / Navigation -->
        <header class="hero-header">
            <button class="menu-btn" aria-label="Open Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            
            <div class="logo-area">
                <img src="https://raw.githubusercontent.com/Emyres970/Ultmteco/refs/heads/main/Src/UC1-1.png" alt="Ultimate Courier Logo" class="logo-img">
            </div>
        </header>

        <!-- Main Hero Content -->
        <div class="hero-content">
            <p class="hero-subtitle">This is the right place</p>
            <h1 class="hero-title">
                COURIER COST<br>
                CALCULATOR
            </h1>
            
            <div class="title-accent-line"></div>

            <div class="hero-buttons">
                <a href="#contact" class="btn btn-blue">
                    <i class="fa-regular fa-comment-dots"></i> CONTACT US
                </a>
                <a href="#services" class="btn btn-grey">
                    <i class="fa-solid fa-truck"></i> OUR SERVICES
                </a>
            </div>
        </div>

        <button class="floating-chat-btn" aria-label="Chat with us">
            <i class="fa-solid fa-comment"></i>
        </button>

    </section>

    <!-- SECTION 1 (Options) -->
    <section class="form-section">
        
        <h2 class="section-title">Section 1</h2>

        <!-- Option 1 -->
        <div class="option-header">
            <h3 class="option-title">Option 1: Enter option here</h3>
            <span class="image-marker">(Requires Image Upload)</span>
        </div>

        <div class="form-box">
            <div class="form-group">
                <label for="form-label" class="form-label">Label Placeholder</label>
                <p class="instruction-text">
                    <span class="instruction-bold">Instruction:</span> 
                    Placeholder for instructions.
                </p>
            </div>

            <div class="form-group upload-group">
                <label for="image-upload" class="upload-label">
                    Upload Image Label Placeholder
                </label>
                <input type="file" id="image-upload" class="file-input" accept="image/*">
            </div>

            <button type="button" class="submit-btn">
                Upload Button Text Placeholder
            </button>
        </div>

    </section>

    <!-- NEW: TOTAL BAR & FOOTER SECTION -->
    <div class="total-bar">
        <div class="total-label">TOTAL</div>
        <div class="total-amount">$ 0.00</div>
    </div>

    <footer class="site-footer">
        
        <!-- PLACEHOLDER: Replace src with your GitHub image link for the footer image -->
        <div class="footer-image-container">
            <img src="https://raw.githubusercontent.com/Emyres970/Ultmteco/refs/heads/main/Src/shutterstock_158330768-320x213.jpg" alt="Courier Service" class="footer-img">
        </div>

        <!-- Calculations Title -->
        <h2 class="footer-heading">Calculators</h2>

        <!-- Footer Navigation Links -->
        <nav class="footer-nav">
            <a href="#" class="footer-link">HOME</a>
            <a href="#" class="footer-link">TRACK SHIPMENT</a>
            <a href="#" class="footer-link">COMPANY</a>
            <a href="#" class="footer-link">SERVICES</a>
            
            <!-- Dropdown/Active Link -->
            <a href="#" class="footer-link active-dropdown">
                COST CALCULATORS 
                <i class="fa-solid fa-chevron-down dropdown-icon"></i>
            </a>
            
            <a href="#" class="footer-link">PRICING</a>
            <a href="#" class="footer-link">CONTACT</a>
        </nav>

        <!-- Brochures Title -->
        <h2 class="footer-heading brochure-heading">Brochures</h2>

    </footer>

    <!-- Your JS -->
    <script src="main.js"></script>
</body>
</html>
